<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Défi des matériaux</title>
<style>
  /* Remise à zéro minimale pour une page autonome */
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; }
  [hidden] { display: none !important; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Mise en page : un tas de vignettes en haut, les groupes en pointillés dessous (sans titres).
     Les vignettes bien rangées prennent leur couleur quand 70 % du groupe est en place. */
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --surface: #1c1f25;
    --line: #2c3038;
    --fg: #e8e6e1;
    --muted: #8b909a;
    --tile: #2a2e36;
    --tile-line: #3b404a;
    --mineral: #8fb7dc;
    --organique: #86cfa6;
    --composite: #d9a860;
    --artificiel: #ea7d68;
    --alert: #ea7d68;
    --font-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-display);
    padding-inline: 16px;
    padding-block: 20px 28px;
  }
  .wrap { max-width: 1100px; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
  h1 { margin: 0; font-size: 1.5rem; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .timer {
    font: 500 1.35rem/1 var(--font-mono);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
    padding: 7px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    min-width: 5.6ch;
    text-align: center;
  }
  .timer.low { color: var(--alert); border-color: var(--alert); }
  button {
    font: 500 0.78rem/1 var(--font-mono);
    color: var(--fg);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 12px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  button:focus-visible, .tile:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  .msg { margin: 0; min-height: 1.4em; font: 500 0.9rem/1.4 var(--font-display); }
  .msg.end { color: var(--fg); }

  .board {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    touch-action: pan-y;
    background-image: radial-gradient(var(--line) 1px, transparent 1px);
    background-size: 24px 24px;
    transition: height .3s;
  }
  .bin {
    position: absolute; z-index: 0;
    border: 1px solid var(--tile-line);
    border-radius: 12px;
    background: rgba(0,0,0,0.22);
    pointer-events: none;
  }
  .bin b {
    position: absolute; left: 12px; top: 8px;
    font: 500 0.72rem/1 var(--font-mono);
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--muted);
  }
  .frame {
    position: absolute; z-index: 0;
    border: 1.5px dashed var(--muted);
    border-radius: 10px;
    pointer-events: none;
    transition: border-color .25s;
  }
  .frame.lit { border-color: var(--c); }
  .tile {
    position: absolute;
    left: 0; top: 0; z-index: 1;
    width: 124px; height: 46px;
    display: flex; align-items: center; justify-content: center;
    padding-inline: 8px;
    font-weight: 500; font-size: 0.95rem;
    text-align: center;
    background: var(--tile);
    border: 1px solid var(--tile-line);
    border-radius: 6px;
    color: var(--fg);
    cursor: grab;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
    box-shadow: 0 1px 0 rgba(0,0,0,0.35);
    transition: background-color .25s, border-color .25s, color .25s;
  }
  .tile.drag { cursor: grabbing; box-shadow: 0 10px 22px rgba(0,0,0,0.5); transition: none; }
  .tile.lit { background: var(--c); border-color: var(--c); color: #14161a; }
  .board.locked .tile { cursor: not-allowed; }
  .tile.fixed { cursor: default; border-color: var(--muted); }
  .tile.fixed::after { content: ""; position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .tile.fixed.lit::after { background: #14161a; }
  .board.anim .tile { transition: transform .45s cubic-bezier(.2,.8,.2,1), background-color .25s, border-color .25s, color .25s; }

  .tip {
    position: fixed; z-index: 20;
    max-width: 240px;
    padding: 8px 11px;
    background: var(--fg); color: var(--bg);
    font: 500 0.82rem/1.35 var(--font-display);
    border-radius: 6px;
    pointer-events: none;
    box-shadow: 0 6px 18px rgba(0,0,0,0.45);
  }
  .hint { margin: 0; font: 400 0.75rem var(--font-mono); color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { .tile, .board, .board.anim .tile, .frame { transition: none; } }
  .tip { display: flex; align-items: center; gap: 10px; max-width: min(320px, calc(100vw - 16px)); }
  .tipbox { position: relative; flex: none; width: 64px; height: 64px; border-radius: 6px; overflow: hidden; background: #cfcac0; }
  .tipbox img, .tipbox canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .tiptxt { flex: 1; min-width: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Défi des matériaux</h1>
    <div class="actions">
      <span class="timer" id="timer" aria-live="off">10:00</span>
      <button id="btn-start" class="primary" type="button">Démarrer</button>
      <button id="btn-check" type="button" disabled>Vérifier (6)</button>
      <button id="btn-restart" type="button">Recommencer</button>
    </div>
  </header>
  <p class="msg" id="msg" role="status">Appuie sur Démarrer : tu as 10 minutes pour ranger les matières dans les bons groupes.</p>
  <div class="board locked" id="board"></div>
  <p class="hint">Survole (ou touche) une vignette pour un indice. Quand un groupe est presque complet, ses vignettes prennent leur couleur.</p>
</div>

<script>
var MatTex = (function () {
  var PI = Math.PI;
  function hashStr(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function h2(ix, iy, s) {
    var h = (Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(s, 1103515245)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  function mkNoise(seed) {
    function lat(ix, iy) { return h2(ix, iy, seed); }
    function noise(x, y) {
      var ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
      fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
      var a = lat(ix, iy), b = lat(ix + 1, iy), c = lat(ix, iy + 1), d = lat(ix + 1, iy + 1);
      return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
    }
    function fbm(x, y, o) {
      var s = 0, a = 0.5, f = 1, n = 0;
      for (var i = 0; i < o; i++) { s += a * noise(x * f + i * 17.3, y * f + i * 9.1); n += a; a *= 0.5; f *= 2.03; }
      return s / n;
    }
    return { noise: noise, fbm: fbm };
  }
  function voro(x, y, s) {
    var ix = Math.floor(x), iy = Math.floor(y), d1 = 9, d2 = 9, id = 0, cx = 0, cy = 0;
    for (var j = -1; j <= 1; j++) for (var i = -1; i <= 1; i++) {
      var gx = ix + i, gy = iy + j;
      var px = gx + h2(gx, gy, s), py = gy + h2(gx, gy, s + 17);
      var dx = px - x, dy = py - y, d = dx * dx + dy * dy;
      if (d < d1) { d2 = d1; d1 = d; id = h2(gx, gy, s + 41); cx = px; cy = py; }
      else if (d < d2) d2 = d;
    }
    return { d1: Math.sqrt(d1), d2: Math.sqrt(d2), id: id, cx: cx, cy: cy };
  }
  function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function smooth(a, b, x) { var t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); }
  function frac(x) { return x - Math.floor(x); }
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function mul(c, k) { return [c[0] * k, c[1] * k, c[2] * k]; }
  function add(c, d, k) { return [c[0] + d[0] * k, c[1] + d[1] * k, c[2] + d[2] * k]; }
  var WHITE = [255, 255, 255];

  /* ---------- fabriques ---------- */
  function brushed(base, grain, shine) {
    return function (c) {
      var N = c.N;
      return function (X, Y) {
        var n = N.fbm(X * 2.5, Y * 120, 3), m = N.fbm(X * 2.2, Y * 2.2, 3);
        var k = 0.72 + 0.55 * (grain * n + (1 - grain) * m);
        var s = Math.pow(Math.abs(Math.sin((X * 1.3 + Y * 0.5) * 3.0)), 10) * shine;
        return add(mul(base, k), WHITE, s * 0.55);
      };
    };
  }
  function speck(o) {
    return function (c) {
      var N = c.N, s = c.seed;
      return function (X, Y) {
        var ix = Math.floor(X * o.scale), iy = Math.floor(Y * o.scale);
        var r = h2(ix, iy, s), v = h2(ix, iy, s + 9);
        var m = N.fbm(X * o.fb, Y * o.fb, 4);
        var col = mul(o.base, 1 + (m - 0.5) * o.fbAmt);
        var acc = 0;
        for (var i = 0; i < o.cols.length; i++) {
          acc += o.cols[i][0];
          if (r < acc) { col = mul(o.cols[i][1], 0.82 + 0.36 * v); break; }
        }
        if (o.blobs) {
          var vo = voro(X * o.blobs.scale, Y * o.blobs.scale, s + 3);
          if (vo.d1 < o.blobs.r && vo.id < o.blobs.p) {
            var bc = o.blobs.cols[Math.floor(vo.id / o.blobs.p * o.blobs.cols.length)];
            col = mul(bc, 0.85 + 0.3 * (1 - vo.d1 / o.blobs.r));
          }
        }
        return col;
      };
    };
  }
  function wood(o) {
    return function (c) {
      var N = c.N;
      return function (X, Y) {
        var t = Y * o.freq + o.warp * N.fbm(X * 1.1, Y * 1.8, 4), d2 = 0;
        if (o.knot) {
          var dx = X - o.knot[0], dy = (Y - o.knot[1]) * 1.5;
          d2 = dx * dx + dy * dy;
          t += o.knot[2] * Math.exp(-d2 * 22);
        }
        var p = Math.pow(frac(t), 2.2);
        var col = mix(o.light, o.dark, p * 0.9);
        col = mul(col, 0.9 + 0.2 * N.fbm(X * 3, Y * 150, 3));
        if (o.knot) col = mix(col, mul(o.dark, 0.5), Math.exp(-d2 * 140));
        return col;
      };
    };
  }
  function weave(o) {
    return function (c) {
      var N = c.N;
      return function (X, Y) {
        var u = X * o.freq, v = Y * o.freq, iu = Math.floor(u), iv = Math.floor(v), fu = u - iu, fv = v - iv;
        var col;
        if (((iu + iv) & 1) === 0) {
          col = mul(o.a, 0.5 + 0.55 * Math.sin(fu * PI));
          col = mul(col, 0.88 + 0.24 * N.fbm(X * 3, Y * o.freq * 2.5, 2));
        } else {
          col = mul(o.b, 0.5 + 0.55 * Math.sin(fv * PI));
          col = mul(col, 0.88 + 0.24 * N.fbm(X * o.freq * 2.5, Y * 3, 2));
        }
        col = mul(col, 1 + o.slub * (N.fbm(X * 3, Y * 3, 3) - 0.5) * 2);
        return add(col, WHITE, o.gloss * Math.pow(Math.abs(Math.sin((X * 1.1 + Y * 0.6) * 3.2)), 8) * 0.3);
      };
    };
  }
  function fibers(base, fib, amt, ruled) {
    return function (c) {
      var N = c.N;
      return function (X, Y) {
        var v = 0.34 * (N.fbm(X * 70, Y * 6, 2) + N.fbm(Y * 70 + 4.3, X * 6, 2) + N.fbm((X + Y) * 50, (X - Y) * 6, 2));
        var col = mix(base, fib, clamp01((0.5 - v) * amt));
        col = mul(col, 0.95 + 0.1 * N.fbm(X * 3, Y * 3, 3));
        if (ruled) {
          var ly = frac(Y / 0.085);
          if (ly < 0.025 && Y > 0.1) col = mix(col, [150, 182, 228], 0.65);
          if (Math.abs(X - 0.22) < 0.004) col = mix(col, [226, 108, 108], 0.7);
        }
        return col;
      };
    };
  }

  /* ---------- table des matières ---------- */
  var GEN = {};
  GEN["Acier"] = brushed([146, 154, 166], 0.8, 0.5);
  GEN["Aluminium"] = brushed([204, 208, 212], 0.7, 0.8);
  GEN["Cuivre"] = brushed([198, 110, 68], 0.6, 0.7);
  GEN["Laiton"] = brushed([204, 166, 66], 0.6, 0.7);
  GEN["Or"] = brushed([238, 192, 58], 0.3, 1.0);
  GEN["Argent"] = brushed([220, 222, 228], 0.4, 1.0);
  GEN["Fer"] = function (c) {
    var N = c.N, s = c.seed;
    return function (X, Y) {
      var col = mul([98, 101, 108], 0.7 + 0.55 * N.fbm(X * 5, Y * 5, 5));
      var rust = smooth(0.52, 0.68, N.fbm(X * 4 + 7, Y * 4 + 3, 5));
      col = mix(col, mix([152, 80, 38], [112, 52, 26], N.fbm(X * 18, Y * 18, 3)), rust * 0.9);
      if (h2(Math.floor(X * 80), Math.floor(Y * 80), s) < 0.04) col = mul(col, 1.4);
      return col;
    };
  };
  GEN["Zinc"] = function (c) {
    return function (X, Y) {
      var v = voro(X * 7, Y * 7, c.seed), e = smooth(0.0, 0.05, v.d2 - v.d1);
      var col = mul([148, 166, 184], (0.7 + 0.5 * v.id) * (0.82 + 0.18 * e));
      return add(col, WHITE, Math.pow(Math.abs(Math.sin((X * 1.2 + Y * 0.8) * 3)), 10) * 0.18);
    };
  };
  GEN["Plomb"] = function (c) {
    var N = c.N;
    return function (X, Y) {
      var col = mul([92, 96, 102], 0.7 + 0.5 * N.fbm(X * 6, Y * 6, 5));
      return add(col, WHITE, smooth(0.78, 0.86, N.fbm(X * 3, Y * 140, 2)) * 0.3);
    };
  };

  GEN["Granit"] = speck({ base: [168, 158, 152], scale: 100, fb: 5, fbAmt: 0.3,
    cols: [[0.2, [30, 30, 34]], [0.14, [238, 232, 226]], [0.14, [186, 118, 108]]] });
  GEN["Marbre"] = function (c) {
    var N = c.N;
    return function (X, Y) {
      var t = X * 3.2 + Y * 2.1 + 2.4 * N.fbm(X * 2.0, Y * 2.0, 5);
      var vein = Math.pow(1 - Math.abs(Math.sin(t * 3.0)), 16);
      var t2 = X * 5 - Y * 3 + 3.0 * N.fbm(X * 3 + 5, Y * 3, 4);
      var v2 = Math.pow(1 - Math.abs(Math.sin(t2 * 4)), 30);
      var col = mix([238, 238, 240], [78, 84, 98], clamp01(vein * 0.85 + v2 * 0.35));
      return mul(col, 0.94 + 0.1 * N.fbm(X * 6, Y * 6, 3));
    };
  };
  GEN["Ardoise"] = function (c) {
    var N = c.N;
    return function (X, Y) {
      var col = mul([72, 82, 94], 0.65 + 0.5 * (0.6 * N.fbm(X * 1.5, Y * 34, 3) + 0.4 * N.fbm(X * 4, Y * 4, 4)));
      var v = voro(X * 3.4, Y * 3.4, c.seed);
      col = mix(col, [22, 26, 32], (1 - smooth(0.0, 0.025, v.d2 - v.d1)) * 0.8);
      return add(col, WHITE, Math.pow(Math.abs(Math.sin(X * 3 + Y * 1.2)), 12) * 0.08);
    };
  };
  GEN["Calcaire"] = function (c) {
    var N = c.N, s = c.seed;
    return function (X, Y) {
      var col = mul([220, 206, 172], 0.85 + 0.3 * N.fbm(X * 5, Y * 5, 5));
      col = mix(col, [236, 226, 198], N.fbm(X * 2, Y * 8, 3) * 0.4);
      if (h2(Math.floor(X * 100), Math.floor(Y * 100), s) < 0.03) col = mul(col, 0.7);
      return col;
    };
  };
  GEN["Basalte"] = function (c) {
    var N = c.N;
    return function (X, Y) {
      var col = mul([54, 56, 60], 0.7 + 0.6 * N.fbm(X * 8, Y * 8, 5));
      var v = voro(X * 14, Y * 14, c.seed);
      if (v.id > 0.6 && v.d1 < 0.2) col = mix(col, [14, 14, 16], 1 - smooth(0.1, 0.2, v.d1));
      return col;
    };
  };
  GEN["Obsidienne"] = function (c) {
    var N = c.N;
    return function (X, Y) {
      var dx = X - 1.0, dy = Y - 0.45, d = Math.sqrt(dx * dx + dy * dy);
      var rip = Math.pow(Math.abs(Math.sin(d * 55 + N.fbm(X * 3, Y * 3, 4) * 7)), 6);
      var sheen = Math.pow(clamp01(0.5 + 0.5 * Math.sin((X * 1.1 - Y * 0.9) * 4.5 + 1)), 9);
      return add([13, 13, 18], WHITE, 0.03 + rip * 0.06 + sheen * 0.38);
    };
  };
  GEN["Grès"] = function (c) {
    var N = c.N, s = c.seed;
    return function (X, Y) {
      var b = 0.5 + 0.5 * Math.sin(Y * 30 + N.fbm(X * 1.5, Y * 3, 3) * 6);
      var col = mix([214, 168, 112], [168, 112, 68], b * 0.8);
      col = mul(col, 0.9 + 0.2 * h2(Math.floor(X * 90), Math.floor(Y * 90), s));
      return mul(col, 0.9 + 0.2 * N.fbm(X * 6, Y * 6, 3));
    };
  };

  GEN["Diamant"] = function (c) {
    return function (X, Y) {
      var v = voro(X * 3.6, Y * 3.6, c.seed), e = 1 - smooth(0.0, 0.04, v.d2 - v.d1);
      var lt = 0.5 + 0.5 * Math.sin(v.id * 12 + (X + Y) * 3);
      var col = mul(mix([150, 205, 235], [250, 252, 255], lt * 0.9 + 0.1 * v.id), 0.82 + 0.25 * (1 - v.d1));
      col = mix(col, WHITE, e * 0.85);
      return add(col, WHITE, Math.pow(clamp01(1 - v.d1 * 3.2), 10) * (v.id > 0.8 ? 1 : 0.2) * 0.5);
    };
  };
  GEN["Sable"] = function (c) {
    var N = c.N, s = c.seed;
    return function (X, Y) {
      var rp = Math.sin(Y * 36 + N.fbm(X * 3, Y * 3, 3) * 9);
      var col = mul([216, 188, 128], 1 + 0.07 * rp + (N.fbm(X * 4, Y * 4, 3) - 0.5) * 0.25);
      var ix = Math.floor(X * 110), iy = Math.floor(Y * 110), r = h2(ix, iy, s), v = h2(ix, iy, s + 5);
      if (r < 0.1) return mul([150, 115, 70], 0.8 + 0.4 * v);
      if (r > 0.92) return mul([246, 232, 204], 0.85 + 0.2 * v);
      return mul(col, 0.92 + 0.16 * v);
    };
  };
  GEN["Argile"] = function (c) {
    var N = c.N;
    return function (X, Y) {
      var col = mul([172, 100, 66], 0.85 + 0.35 * N.fbm(X * 3, Y * 3, 4));
      var v = voro(X * 5.2, Y * 5.2, c.seed);
      col = mul(col, 0.92 + 0.16 * v.id);
      return mix(col, [84, 46, 32], (1 - smooth(0.0, 0.045, v.d2 - v.d1)) * 0.85);
    };
  };
  GEN["Terre"] = speck({ base: [76, 50, 32], scale: 50, fb: 6, fbAmt: 0.45,
    cols: [[0.18, [34, 24, 16]], [0.14, [118, 86, 58]], [0.04, [168, 150, 128]]],
    blobs: { scale: 10, r: 0.2, p: 0.35, cols: [[110, 92, 76], [140, 120, 100]] } });
  GEN["Eau"] = function (c) {
    var N = c.N;
    return function (X, Y) {
      var wv = Math.sin(X * 16 + N.fbm(X * 3, Y * 3, 3) * 6) + Math.sin(Y * 20 + X * 5 + N.fbm(X * 2.4, Y * 2.4 + 3, 3) * 6);
      var col = mix([14, 76, 140], [60, 164, 214], clamp01(0.5 + 0.25 * wv));
      var caus = Math.pow(1 - Math.abs(N.fbm(X * 7, Y * 7, 4) * 2 - 1), 7);
      return mul(add(col, [210, 240, 230], caus * 0.35), 0.9 + 0.2 * (1 - Y));
    };
  };

    "Eau": "Liquide qui se solidifie à 0 °C",
    "Sel": "Cristaux cubiques qui se dissolvent dans l'eau",
    "Bois": "Vient du tronc des arbres",
    "Chêne": "Vient d'un arbre qui donne des glands",
    "Bambou": "Vient d'une herbe géante à tige creuse",
    "Liège": "Vient de l'écorce d'un arbre",
    "Cellulose": "Molécule qui forme la paroi des cellules des plantes",
    "Lin": "Fibre d'une plante à fleurs bleues",
    "Coton": "Fibre qui entoure les graines du cotonnier",
    "Chanvre": "Fibre solide d'une plante, utilisée pour les cordes",
    "Latex": "Sève blanche d'un arbre, l'hévéa",
    "Résine": "Sève collante des conifères",
    "Paille": "Tige sèche d'une céréale",
    "Kératine": "Protéine des cheveux, des ongles et des plumes",
    "Chitine": "Carapace des insectes et des crabes",
    "Ivoire": "Défenses d'éléphant",
    "Laine": "Poils du mouton",
    "Soie": "Fil produit par un ver",
    "Os": "Squelette des vertébrés, riche en calcium",
    "Cire": "Fabriquée par les abeilles pour leurs rayons",
    "Charbon": "Noir, issu de forêts enfouies il y a des millions d'années",
    "Goudron": "Noir et collant, issu du pétrole, donc d'êtres vivants enfouis",
    "Béton": "Mélange de ciment, de sable et de gravier pour bâtir",
    "Ciment": "Poudre grise qui durcit avec l'eau pour bâtir",
    "Brique": "Argile moulée puis cuite, pour bâtir",
    "Plâtre": "Poudre blanche + eau, pour les murs intérieurs",
    "Céramique": "Argile cuite : assiettes et carrelage",
    "Porcelaine": "Argile blanche cuite à très haute température",
    "Papier": "Fibres végétales réduites en feuille",
    "Carton": "Papier épais, souvent ondulé",
    "Cuir": "Peau animale tannée",
    "Contre-plaqué": "Feuilles de bois collées en croisant les fibres",
    "Fibre de carbone": "Fibres noires dans une résine : léger et très rigide",
    "Fibre de verre": "Fibres de verre dans une résine : coques de bateaux",
    "PVC": "Fabriqué à partir de pétrole : tuyaux blancs",
    "Polyéthylène": "Fabriqué à partir de pétrole : sacs et bouteilles souples",
    "PLA": "Fabriqué à partir de maïs : filament d'imprimante 3D",
    "Nylon": "Fabriqué en usine : fibre des collants",
    "Silicone": "Fabriqué en usine, souple : moules de cuisine",
    "Caoutchouc": "Élastique, souvent synthétique : pneus",
    "Polyester": "Fibre fabriquée en usine : vêtements polaires",
    "Plexiglas": "Fabriqué en usine, transparent et léger",
    "Polystyrène": "Fabriqué en usine, blanc et léger : cale les colis",
    "Verre": "Sable fondu puis refroidi, transparent"
  };

  var CATS = [
    { id: "mineral", groups: [
      { title: "Métaux", items: ["Acier", "Aluminium", "Cuivre", "Fer", "Laiton", "Zinc", "Or", "Argent", "Plomb"] },
      { title: "Roches", items: ["Granit", "Marbre", "Ardoise", "Calcaire", "Basalte", "Obsidienne", "Grès"] },
      { title: "Minéraux, sols et eau", items: ["Diamant", "Sable", "Argile", "Terre", "Eau", "Sel"] }
    ]},
    { id: "organique", groups: [
      { title: "Végétales", items: ["Bois", "Chêne", "Bambou", "Liège", "Cellulose", "Lin", "Coton", "Chanvre", "Latex", "Résine", "Paille"] },
      { title: "Animales", items: ["Kératine", "Chitine", "Ivoire", "Laine", "Soie", "Os", "Cire"] },
      { title: "Fossiles", items: ["Charbon", "Goudron"] }
    ]},
    { id: "composite", groups: [
      { title: "Construction", items: ["Béton", "Ciment", "Brique", "Plâtre"] },
      { title: "Céramiques", items: ["Céramique", "Porcelaine"] },
      { title: "Papier, carton, cuir", items: ["Papier", "Carton", "Cuir"] },
      { title: "Composites techniques", items: ["Contre-plaqué", "Fibre de carbone", "Fibre de verre"] }
    ]},
    { id: "artificiel", groups: [
      { title: "Polymères", items: ["PVC", "Polyéthylène", "PLA", "Nylon", "Silicone", "Caoutchouc", "Polyester", "Plexiglas", "Polystyrène"] },
      { title: "Verre", items: ["Verre"] }
    ]}
  ];

  var GROUPS = [], groupOf = {}, catOf = {};
  CATS.forEach(function (c) {
    c.groups.forEach(function (g) {
      var gi = GROUPS.length;
      GROUPS.push({ title: g.title, cat: c.id, items: g.items });
      g.items.forEach(function (n) { groupOf[n] = gi; catOf[n] = c.id; });
    });
  });

  var SEEDS = { "Métaux": "Cuivre", "Roches": "Granit", "Minéraux, sols et eau": "Sable", "Végétales": "Bois",
    "Animales": "Laine", "Fossiles": "Charbon", "Construction": "Béton", "Céramiques": "Céramique",
    "Papier, carton, cuir": "Carton", "Composites techniques": "Fibre de carbone", "Polymères": "PVC", "Verre": "Verre" };
  var DURATION = 600, MAXCHECKS = 6, THRESH = 0.7;
  var W = 124, H = 46, GAP = 12, PAD = 16, GP = 14, TH = 18, GG = 16;
  var board = document.getElementById("board");
  var elTimer = document.getElementById("timer");
  var btnStart = document.getElementById("btn-start");
  var btnCheck = document.getElementById("btn-check");
  var btnRestart = document.getElementById("btn-restart");
  var elMsg = document.getElementById("msg");

  var byName = {}, tiles = [], z = 1, L = null, overlay = [], PH = 190;
  var running = false, ended = false, checksLeft = MAXCHECKS, endAt = 0, timerId = null;

  /* Indices au survol */
  var tip = document.createElement("div");
  tip.className = "tip";
  tip.setAttribute("role", "tooltip");
  tip.hidden = true;
  document.body.appendChild(tip);
  tip.innerHTML = '<div class="tipbox"><canvas width="64" height="64"></canvas><img alt="" hidden></div><div class="tiptxt"></div>';
  var tipCv = tip.querySelector("canvas"), tipPic = tip.querySelector("img"), tipTxt = tip.querySelector(".tiptxt");
  var texCache = {}, picOk = {};
  function slug(n) { return n.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
  function drawTex(name) {
    var d = texCache[name];
    if (d === undefined) {
      try { d = new ImageData(MatTex.render(name, 64, 64), 64, 64); } catch (e) { d = null; }
      texCache[name] = d;
    }
    if (d) tipCv.getContext("2d").putImageData(d, 0, 0);
    tipCv.hidden = !d;
  }
  // Vignette : illustration images/<nom>.png si elle existe, sinon la texture dessinée en code.
  function showPic(name) {
    var s = slug(name);
    drawTex(name);
    tipPic.hidden = true;
    if (picOk[s] === false) return;
    tipPic.dataset.n = s;
    tipPic.onload = function () { picOk[s] = true; if (tipPic.dataset.n === s) tipPic.hidden = false; };
    tipPic.onerror = function () { picOk[s] = false; };
    tipPic.src = "images/" + s + ".png";
  }
  var tipTimer = null;
  function showTip(el) {
    var txt = CLUES[el.textContent];
    if (!txt) return;
    clearTimeout(tipTimer);
    tipTxt.textContent = txt;
    showPic(el.textContent);
    tip.hidden = false;
    var r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    var left = Math.min(Math.max(8, r.left + r.width / 2 - tw / 2), window.innerWidth - tw - 8);
    var top = r.top - th - 8;
    if (top < 8) top = r.bottom + 8;
    tip.style.left = left + "px";
    tip.style.top = top + "px";
  }
  function hideTip() { clearTimeout(tipTimer); tip.hidden = true; }

  /* Géométrie : tas en haut, groupes en grille dessous. */
  function compute() {
    var bw = board.clientWidth;
    var maxCols = Math.max(1, Math.floor((bw - 2 * PAD - 2 * GP + GAP) / (W + GAP)));
    var cols = Math.min(3, maxCols);
    var fw = cols * (W + GAP) - GAP + 2 * GP;
    var perLine = Math.max(1, Math.floor((bw - 2 * PAD + GG) / (fw + GG)));
    var y = PAD + PH + 30, frames = [], gi = 0;
    CATS.forEach(function (cat) {
      for (var s = 0; s < cat.groups.length; s += perLine) {
        var line = cat.groups.slice(s, s + perLine);
        var maxRows = 0;
        line.forEach(function (g) { maxRows = Math.max(maxRows, Math.ceil(g.items.length / cols) + 1); });
        var fh = TH + maxRows * (H + GAP) - GAP + GP;
        line.forEach(function (g, k) {
          frames.push({ x: PAD + k * (fw + GG), y: y, w: fw, h: fh, g: gi, cat: cat.id, cap: maxRows * cols });
          gi++;
        });
        y += fh + GG;
      }
      y += 14;
    });
    var binW = Math.min(bw - 2 * PAD, 600);
    return { frames: frames, cols: cols, height: y - GG, bin: { x: (bw - binW) / 2, y: PAD, w: binW, h: PH } };
  }
  function slotPos(f, s) {
    return { x: f.x + GP + (s % L.cols) * (W + GAP), y: f.y + TH + Math.floor(s / L.cols) * (H + GAP) };
  }
  function build() {
    overlay.forEach(function (n) { n.remove(); });
    overlay = [];
    PH = board.clientWidth < 600 ? 240 : 190;
    L = compute();
    board.style.height = L.height + "px";
    var first = board.firstChild;
    var bin = document.createElement("div");
    bin.className = "bin";
    bin.style.cssText = "left:" + L.bin.x + "px;top:" + L.bin.y + "px;width:" + L.bin.w + "px;height:" + L.bin.h + "px";
    var lab = document.createElement("b");
    lab.textContent = "À classer";
    bin.appendChild(lab);
    board.insertBefore(bin, first); overlay.push(bin);
    L.frames.forEach(function (f) {
      var d = document.createElement("div");
      d.className = "frame";
      d.style.cssText = "left:" + f.x + "px;top:" + f.y + "px;width:" + f.w + "px;height:" + f.h + "px;--c:var(--" + f.cat + ")";
      board.insertBefore(d, first); overlay.push(d);
      f.el = d;
    });
  }

  function place(el, x, y, r) {
    el._x = x; el._y = y; el._r = r || 0;
    el.style.transform = "translate(" + x + "px," + y + "px) rotate(" + (r || 0) + "deg)";
  }
  function animate() {
    board.classList.add("anim");
    clearTimeout(animate._t);
    animate._t = setTimeout(function () { board.classList.remove("anim"); }, 520);
  }
  function pilePos() {
    var b = L.bin;
    return {
      x: b.x + 8 + Math.random() * Math.max(1, b.w - W - 16),
      y: b.y + 24 + Math.random() * Math.max(1, b.h - H - 32),
      r: (Math.random() - 0.5) * 16
    };
  }
  function sendToPile(el) {
    var p = pilePos();
    el._f = -1; el._slot = -1;
    el.style.zIndex = ++z;
    animate();
    place(el, p.x, p.y, p.r);
  }
  function isCorrect(el) { return el._f >= 0 && L.frames[el._f].g === el._g; }
  function inPile(el) { return el._f < 0 && el._y + H / 2 < PAD + PH + 14; }

  function snap(el) {
    var cx = el._x + W / 2, cy = el._y + H / 2, fi = -1;
    L.frames.forEach(function (f, i) {
      if (cx >= f.x && cx <= f.x + f.w && cy >= f.y && cy <= f.y + f.h) fi = i;
    });
    if (fi < 0) { el._f = -1; el._slot = -1; return; }
    var f = L.frames[fi], used = {};
    tiles.forEach(function (t) { if (t !== el && t._f === fi) used[t._slot] = true; });
    var best = -1, bd = Infinity;
    for (var s = 0; s < f.cap; s++) {
      if (used[s]) continue;
      var p = slotPos(f, s), d = (p.x - el._x) * (p.x - el._x) + (p.y - el._y) * (p.y - el._y);
      if (d < bd) { bd = d; best = s; }
    }
    if (best < 0) { sendToPile(el); return; }
    el._f = fi; el._slot = best;
    var q = slotPos(f, best);
    animate();
    place(el, q.x, q.y, 0);
  }

  /* Couleurs : un groupe s'allume quand 70 % de ses matières sont dans le bon cadre. */
  function evaluate() {
    GROUPS.forEach(function (g, gi) {
      var n = g.items.length, need = Math.ceil(THRESH * n - 1e-9), ok = 0;
      tiles.forEach(function (t) { if (t._g === gi && isCorrect(t)) ok++; });
      var lit = ok >= need;
      L.frames[gi].el.classList.toggle("lit", lit);
      tiles.forEach(function (t) { if (t._g === gi) t.classList.toggle("lit", lit && isCorrect(t)); });
    });
  }
  function countCorrect() {
    var n = 0;
    tiles.forEach(function (t) { if (isCorrect(t)) n++; });
    return n;
  }

  function setMsg(txt, end) { elMsg.textContent = txt; elMsg.className = "msg" + (end ? " end" : ""); }
  function fmt(s) {
    s = Math.max(0, Math.ceil(s));
    return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }
  function updateButtons() {
    btnStart.disabled = running || ended;
    btnStart.textContent = running ? "En cours" : "Démarrer";
    btnCheck.disabled = !running || checksLeft <= 0;
    btnCheck.textContent = "Vérifier (" + checksLeft + ")";
  }
  function tick() {
    var left = (endAt - Date.now()) / 1000;
    elTimer.textContent = fmt(left);
    elTimer.classList.toggle("low", left <= 60);
    if (left <= 0) finish("time");
  }

  function sendWrong() {
    var sent = 0;
    tiles.forEach(function (t) {
      if (!isCorrect(t) && !inPile(t)) { sendToPile(t); sent++; }
    });
    evaluate();
    return sent;
  }
  function verify() {
    if (!running || checksLeft <= 0) return;
    checksLeft--;
    var ok = countCorrect(), sent = sendWrong();
    var txt = ok + " / " + tiles.length + " bien placées.";
    if (sent) txt += " " + sent + (sent > 1 ? " vignettes renvoyées" : " vignette renvoyée") + " sur le tas.";
    if (checksLeft === 0) txt += " Plus de vérification disponible.";
    setMsg(txt);
    updateButtons();
    if (ok === tiles.length) finish("win");
  }
  function finish(reason) {
    if (ended) return;
    clearInterval(timerId); timerId = null;
    running = false; ended = true;
    board.classList.add("locked");
    var spent = Math.round(DURATION - Math.max(0, (endAt - Date.now()) / 1000));
    var ok = countCorrect();
    sendWrong();
    if (reason === "win") {
      setMsg("Bravo ! " + tiles.length + " / " + tiles.length + " en " + fmt(spent) + ".", true);
    } else {
      setMsg("Temps écoulé. Résultat final : " + ok + " / " + tiles.length + " bien placées.", true);
      elTimer.textContent = "00:00";
    }
    updateButtons();
  }
  function start() {
    if (running || ended) return;
    running = true;
    board.classList.remove("locked");
    endAt = Date.now() + DURATION * 1000;
    timerId = setInterval(tick, 250);
    tick();
    setMsg("C'est parti ! Glisse chaque matière dans un groupe.");
    updateButtons();
  }
  function restart() {
    clearInterval(timerId); timerId = null;
    running = false; ended = false; checksLeft = MAXCHECKS;
    elTimer.textContent = fmt(DURATION);
    elTimer.classList.remove("low");
    board.classList.add("locked");
    tiles.forEach(function (t) { t.classList.remove("lit"); });
    build();
    tiles.forEach(function (t) {
      var p = pilePos();
      t._f = -1; t._slot = -1;
      t.style.zIndex = ++z;
      place(t, p.x, p.y, p.r);
    });
    // Une vignette verrouillée dans chaque groupe, comme point de départ.
    tiles.forEach(function (t) { t._lock = false; t.classList.remove("fixed"); });
    GROUPS.forEach(function (g, gi) {
      var t = byName[SEEDS[g.title]];
      if (!t) return;
      var p = slotPos(L.frames[gi], 0);
      t._lock = true; t._f = gi; t._slot = 0;
      t.classList.add("fixed");
      place(t, p.x, p.y, 0);
    });
    evaluate();
    setMsg("Appuie sur Démarrer : tu as 10 minutes pour ranger les " + (tiles.length - GROUPS.length) + " matières restantes. Une vignette est déjà fixée dans chaque groupe.");
    updateButtons();
  }

  /* Vignettes */
  var names = [];
  GROUPS.forEach(function (g) { g.items.forEach(function (n) { names.push(n); }); });
  names.forEach(function (name) {
    var el = document.createElement("div");
    el.className = "tile";
    el.tabIndex = 0;
    el.textContent = name;
    el._g = groupOf[name];
    el._f = -1; el._slot = -1;
    el.style.setProperty("--c", "var(--" + catOf[name] + ")");
    board.appendChild(el);
    tiles.push(el);
    byName[name] = el;
    bindDrag(el);
    el.addEventListener("pointerenter", function (e) { if (e.pointerType === "mouse" && !el.classList.contains("drag")) showTip(el); });
    el.addEventListener("pointerleave", function (e) { if (e.pointerType === "mouse") hideTip(); });
    el.addEventListener("focus", function () { showTip(el); });
    el.addEventListener("blur", hideTip);
  });

  function clamp(x, y) {
    return [Math.min(Math.max(0, x), Math.max(0, board.clientWidth - W)),
            Math.min(Math.max(0, y), Math.max(0, board.clientHeight - H))];
  }
  function bindDrag(el) {
    var sx, sy, ox, oy, id = null, moved = false;
    el.addEventListener("pointerdown", function (e) {
      hideTip();
      if (!running || el._lock) return;
      if (e.button !== undefined && e.button !== 0) return;
      id = e.pointerId; moved = false;
      el.setPointerCapture(id);
      sx = e.clientX; sy = e.clientY; ox = el._x; oy = el._y;
      el._f = -1; el._slot = -1;
      el.classList.add("drag");
      el.style.zIndex = ++z;
      place(el, el._x, el._y, 0);
      evaluate();
      e.preventDefault();
    });
    el.addEventListener("pointermove", function (e) {
      if (id !== e.pointerId) return;
      moved = true;
      var c = clamp(ox + e.clientX - sx, oy + e.clientY - sy);
      place(el, c[0], c[1], 0);
    });
    function end(e) {
      if (id !== e.pointerId) return;
      id = null;
      el.classList.remove("drag");
      snap(el);
      evaluate();
      if (e.pointerType !== "mouse" && !moved) {
        showTip(el);
        tipTimer = setTimeout(hideTip, 2500);
      } else if (e.pointerType === "mouse") {
        showTip(el);
      }
    }
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", end);
    el.addEventListener("keydown", function (e) {
      if (!running || el._lock) return;
      var d = e.shiftKey ? 40 : 12, dx = 0, dy = 0;
      if (e.key === "ArrowLeft") dx = -d;
      else if (e.key === "ArrowRight") dx = d;
      else if (e.key === "ArrowUp") dy = -d;
      else if (e.key === "ArrowDown") dy = d;
      else return;
      e.preventDefault();
      el._f = -1; el._slot = -1;
      var c = clamp(el._x + dx, el._y + dy);
      place(el, c[0], c[1], 0);
      el.style.zIndex = ++z;
    });
    el.addEventListener("keyup", function (e) {
      if (!running || el._lock || e.key.indexOf("Arrow") !== 0) return;
      snap(el);
      evaluate();
    });
  }

  btnStart.addEventListener("click", start);
  btnCheck.addEventListener("click", verify);
  btnRestart.addEventListener("click", restart);

  var lastW = 0;
  window.addEventListener("resize", function () {
    var w = board.clientWidth;
    if (w === lastW) return;
    lastW = w;
    build();
    tiles.forEach(function (t) {
      if (t._f >= 0) {
        var p = slotPos(L.frames[t._f], t._slot);
        place(t, p.x, p.y, 0);
      } else {
        var c = clamp(t._x, t._y);
        place(t, c[0], c[1], t._r);
      }
    });
    evaluate();
  });

  // Mélange de l'ordre d'empilement, puis premier tas.
  for (var i = tiles.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = tiles[i]; tiles[i] = tiles[j]; tiles[j] = tmp;
  }
  restart();
  lastW = board.clientWidth;
})();
</script>
</body>
</html>
