<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Défi des matériaux</title>
<style>
  /* Remise à zéro minimale pour une page autonome */
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; }
  [hidden] { display: none !important; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Mise en page : un tas de vignettes en haut, les groupes en pointillés dessous (sans titres).
     Les vignettes bien rangées prennent leur couleur quand 70 % du groupe est en place. */
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --surface: #1c1f25;
    --line: #2c3038;
    --fg: #e8e6e1;
    --muted: #8b909a;
    --tile: #2a2e36;
    --tile-line: #3b404a;
    --mineral: #8fb7dc;
    --organique: #86cfa6;
    --composite: #d9a860;
    --artificiel: #ea7d68;
    --alert: #ea7d68;
    --font-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-display);
    padding-inline: 16px;
    padding-block: 20px 28px;
  }
  .wrap { max-width: 1800px; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
  h1 { margin: 0; font-size: 1.5rem; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .timer {
    font: 500 1.35rem/1 var(--font-mono);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
    padding: 7px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    min-width: 5.6ch;
    text-align: center;
  }
  .timer.low { color: var(--alert); border-color: var(--alert); }
  button {
    font: 500 0.78rem/1 var(--font-mono);
    color: var(--fg);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 12px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  button:focus-visible, .tile:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  .msg { margin: 0; min-height: 1.4em; font: 500 0.9rem/1.4 var(--font-display); }
  .msg.end { color: var(--fg); }

  .board {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    touch-action: pan-y;
    background-image: radial-gradient(var(--line) 1px, transparent 1px);
    background-size: 24px 24px;
    transition: height .3s;
  }
  .bin {
    position: absolute; z-index: 0;
    border: 1px solid var(--tile-line);
    border-radius: 12px;
    background: rgba(0,0,0,0.22);
    pointer-events: none;
  }
  .bin b {
    position: absolute; left: 12px; top: 8px;
    font: 500 0.72rem/1 var(--font-mono);
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--muted);
  }
  .frame {
    position: absolute; z-index: 0;
    border: 1.5px dashed var(--muted);
    border-radius: 10px;
    pointer-events: none;
    transition: border-color .25s;
  }
  .frame.lit { border-color: var(--c); }
  .tile {
    position: absolute;
    left: 0; top: 0; z-index: 1;
    width: var(--tw, 124px); height: var(--th, 46px);
    display: flex; align-items: center; justify-content: center;
    padding-inline: var(--tp, 8px);
    font-weight: 500; font-size: var(--tf, 0.95rem); line-height: 1.1;
    overflow-wrap: anywhere;
    text-align: center;
    background: var(--tile);
    border: 1px solid var(--tile-line);
    border-radius: 6px;
    color: var(--fg);
    cursor: grab;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
    box-shadow: 0 1px 0 rgba(0,0,0,0.35);
    transition: background-color .25s, border-color .25s, color .25s;
  }
  .tile.drag { cursor: grabbing; box-shadow: 0 10px 22px rgba(0,0,0,0.5); transition: none; }
  .tile.lit { background: var(--c); border-color: var(--c); color: #14161a; }
  .board.locked .tile { cursor: not-allowed; }
  .tile.fixed { cursor: default; border-color: var(--muted); }
  .tile.fixed::after { content: ""; position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .tile.lit.off { outline: 1.5px dashed #14161a; outline-offset: -4px; }
  .tile.fixed.lit::after { background: #14161a; }
  .board.anim .tile { transition: transform .45s cubic-bezier(.2,.8,.2,1), background-color .25s, border-color .25s, color .25s; }

  .tip {
    position: fixed; z-index: 20;
    max-width: 240px;
    padding: 8px 11px;
    background: var(--fg); color: var(--bg);
    font: 500 0.82rem/1.35 var(--font-display);
    border-radius: 6px;
    pointer-events: none;
    box-shadow: 0 6px 18px rgba(0,0,0,0.45);
  }
  .hint { margin: 0; font: 400 0.75rem var(--font-mono); color: var(--muted); }

  @media (max-width: 671px) {
    .frame b { font-size: 0.62rem; left: 8px; top: 6px; }
    .cat { font-size: 0.9rem; }
    h1 { font-size: 1.25rem; }
  }
  @media (prefers-reduced-motion: reduce) { .tile, .board, .board.anim .tile, .frame { transition: none; } }
  .dock { position: absolute; z-index: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; pointer-events: none; box-sizing: border-box; padding: 4px; border: 1.5px dashed var(--muted); border-radius: 10px; color: var(--muted); font: 500 0.68rem/1.3 var(--font-mono); text-align: center; }
  .dock.on .ph { display: none; }
  .dock .tip { position: static; z-index: auto; max-width: none; width: 100%; box-sizing: border-box; padding: 4px 6px; box-shadow: none; font-size: 0.68rem; line-height: 1.25; gap: 6px; }
  .dock .tipbox { width: 44px; height: 44px; }
  .bin .dock { right: 8px; top: 26px; bottom: 8px; width: 116px; }
  .bin .dock .tip { flex-direction: column; text-align: center; }
  .bin .dock .tipbox { width: 52px; height: 52px; }
  .tip[hidden] { display: none; }
  .tip { display: flex; align-items: center; gap: 10px; max-width: min(320px, calc(100vw - 16px)); }
  .tipbox { position: relative; flex: none; width: 64px; height: 64px; border-radius: 6px; overflow: hidden; background: #cfcac0; }
  .tipbox img, .tipbox canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .tiptxt { flex: 1; min-width: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Défi des matériaux</h1>
    <div class="actions">
      <span class="timer" id="timer" aria-live="off">10:00</span>
      <button id="btn-start" class="primary" type="button">Démarrer</button>
      <button id="btn-check" type="button" disabled>Vérifier (6)</button>
      <button id="btn-restart" type="button">Recommencer</button>
    </div>
  </header>
  <p class="msg" id="msg" role="status">Appuie sur Démarrer : tu as 10 minutes pour ranger les matières dans les bons groupes.</p>
  <div class="board locked" id="board"></div>
  <p class="hint">Survole (ou touche) une vignette pour un indice. Quand un groupe est presque complet, ses vignettes prennent leur couleur.</p>
</div>

        e.base = e.c * W + (e.c - 1) * GAP + 2 * GP;
        base += e.base;
        maxRows = Math.max(maxRows, Math.ceil(e.g.items.length / e.c));
      });
      maxRows += (o.spare || 0);
      var extra = Math.max(0, inner - base - (n - 1) * GG), x = PAD;
      var fh = FTH + maxRows * (H + GAP) - GAP + GP;
      l.items.forEach(function (e) {
        var fw = e.base + extra / n;
        frames.push({ x: x, y: y, w: fw, h: fh, title: e.g.title, id: e.cat, cat: e.cat, g: e.gi, c: e.c, cap: maxRows * e.c,
                      ox: (fw - (e.c * W + (e.c - 1) * GAP)) / 2, items: e.g.items });
        x += fw + GG;
      });
      y += fh + GG;
      var nx = lines[li + 1];
      if (nx && nx.cat !== l.cat) y += (o.catGap || 0);
    });
    return { frames: frames, cats: cats, height: y - GG + PAD, inner: inner };
  }
  function slotPos(f, s) {
    return { x: Math.round(f.x + f.ox + (s % f.c) * (W + GAP)), y: Math.round(f.y + FTH + Math.floor(s / f.c) * (H + GAP)) };
  }
  function applySize() {
    var pad = compact ? 3 : 8, fs = Math.min(15.2, Math.max(9, (W - 2 * pad) / 6.4));
    board.style.setProperty("--tw", W + "px");
    board.style.setProperty("--th", H + "px");
    board.style.setProperty("--tp", pad + "px");
    board.style.setProperty("--tf", fs.toFixed(1) + "px");
  }
  var PS = { thD: 18, thC: 10, spare: 1, topExtra: 0, catH: 0, catGap: 14 };
  var running = false, ended = false, checksLeft = MAXCHECKS, endAt = 0, timerId = null;

  /* Indices au survol */
  var tip = document.createElement("div");
  tip.className = "tip";
  tip.setAttribute("role", "tooltip");
  tip.hidden = true;
  document.body.appendChild(tip);
  tip.innerHTML = '<div class="tipbox"><canvas width="64" height="64"></canvas><img alt="" hidden></div><div class="tiptxt"></div>';
  var tipCv = tip.querySelector("canvas"), tipPic = tip.querySelector("img"), tipTxt = tip.querySelector(".tiptxt");
  var texCache = {}, picOk = {};
  function slug(n) { return n.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
  function drawTex(name) {
    var d = texCache[name];
    if (d === undefined) {
      try { d = new ImageData(MatTex.render(name, 64, 64), 64, 64); } catch (e) { d = null; }
      texCache[name] = d;
    }
    if (d) tipCv.getContext("2d").putImageData(d, 0, 0);
    tipCv.hidden = !d;
  }
  // Vignette : illustration images/<nom>.png si elle existe, sinon la texture dessinée en code.
  function showPic(name) {
    var s = slug(name);
    drawTex(name);
    tipPic.hidden = true;
    if (picOk[s] === false) return;
    tipPic.dataset.n = s;
    tipPic.onload = function () { picOk[s] = true; if (tipPic.dataset.n === s) tipPic.hidden = false; };
    tipPic.onerror = function () { picOk[s] = false; };
    tipPic.src = MAT_IMGS[s] || ("images/" + s + ".png");
  }
  var tipTimer = null, dockEl = null;
  function showTip(el) {
    var txt = CLUES[el.textContent];
    if (!txt) return;
    clearTimeout(tipTimer);
    tipTxt.textContent = txt;
    showPic(el.textContent);
    tip.hidden = false;
    if (isPhone() && dockEl) {            // smartphone : cadre réservé à droite du tas
      if (tip.parentNode !== dockEl) dockEl.appendChild(tip);
      dockEl.classList.add("on");
      return;
    }
    if (tip.parentNode !== document.body) document.body.appendChild(tip);
    var r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    var left = Math.min(Math.max(8, r.left + r.width / 2 - tw / 2), window.innerWidth - tw - 8);
    var top = r.top - th - 8;
    if (top < 8) top = r.bottom + 8;
    tip.style.left = left + "px";
    tip.style.top = top + "px";
  }
  function hideTip() { clearTimeout(tipTimer); tip.hidden = true; if (dockEl) dockEl.classList.remove("on"); }

  /* Défilement automatique de la page pendant un glisser : lent puis de plus en plus rapide près du bord haut/bas de l'écran. */
  var AUTO = { zone: 120, max: 26 };
  var autoV = 0, autoAcc = 0, autoRaf = 0, autoFn = null;
  function autoStep() {
    autoRaf = 0;
    if (!autoV || !autoFn) return;
    autoAcc += autoV;
    var d = autoAcc < 0 ? Math.ceil(autoAcc) : Math.floor(autoAcc);
    if (d) { autoAcc -= d; window.scrollBy(0, d); autoFn(); }
    autoRaf = requestAnimationFrame(autoStep);
  }
  function autoScroll(clientY, fn) {
    var h = window.innerHeight, v = 0, t;
    if (clientY > h - AUTO.zone) { t = Math.min(1, (clientY - (h - AUTO.zone)) / AUTO.zone); v = AUTO.max * t * t; }
    else if (clientY < AUTO.zone) { t = Math.min(1, (AUTO.zone - clientY) / AUTO.zone); v = -AUTO.max * t * t; }
    autoV = v; autoFn = fn;
    if (v && !autoRaf) autoRaf = requestAnimationFrame(autoStep);
  }
  function autoStop() { autoV = 0; autoAcc = 0; autoFn = null; if (autoRaf) cancelAnimationFrame(autoRaf); autoRaf = 0; }
  function isPhone() { return board.clientWidth < 640; }

  /* Géométrie : tas en haut, groupes en grille dessous. */
  function compute() {
    var bw = board.clientWidth;
    PH = bw < 640 ? 260 : 190;
    PS.topExtra = PH + 30;
    var P = plan(bw, PS);
    applySize();
    return { frames: P.frames, height: P.height, bin: { x: PAD, y: PAD, w: P.inner, h: PH, pw: bw < 640 ? P.inner - 126 : P.inner } };
  }
  function build() {
    document.body.appendChild(tip); tip.hidden = true; dockEl = null;
    overlay.forEach(function (n) { n.remove(); });
    overlay = [];
    L = compute();
    board.style.height = L.height + "px";
    var first = board.firstChild;
    var bin = document.createElement("div");
    bin.className = "bin";
    bin.style.cssText = "left:" + L.bin.x + "px;top:" + L.bin.y + "px;width:" + L.bin.w + "px;height:" + L.bin.h + "px";
    var lab = document.createElement("b");
    lab.textContent = "À classer";
    bin.appendChild(lab);
    if (board.clientWidth < 640) {      // cadre image + indice, réservé à droite du tas
      dockEl = document.createElement("div");
      dockEl.className = "dock";
      dockEl.innerHTML = '<span class="ph">Touche une vignette : image + indice</span>';
      bin.appendChild(dockEl);
    }
    board.insertBefore(bin, first); overlay.push(bin);
    L.frames.forEach(function (f) {
      var d = document.createElement("div");
      d.className = "frame";
      d.style.cssText = "left:" + f.x + "px;top:" + f.y + "px;width:" + f.w + "px;height:" + f.h + "px;--c:" + GROUPS[f.g].shade;
      board.insertBefore(d, first); overlay.push(d);
      f.el = d;
    });
  }

  function place(el, x, y, r) {
    el._x = x; el._y = y; el._r = r || 0;
    el.style.transform = "translate(" + x + "px," + y + "px) rotate(" + (r || 0) + "deg)";
  }
  function animate() {
    board.classList.add("anim");
    clearTimeout(animate._t);
    animate._t = setTimeout(function () { board.classList.remove("anim"); }, 520);
  }
  // Le tas est un amas centré dans le bac : positions mémorisées en px depuis le centre (dx) et en fraction de hauteur (v).
  function pileXY(dx, v) {
    var b = L.bin, half = Math.max(0, (b.pw - W) / 2);
    return {
      x: Math.round(b.x + half + Math.max(-half, Math.min(half, dx))),
      y: Math.round(b.y + 24 + Math.max(0, Math.min(1, v)) * Math.max(0, b.h - H - 32))
    };
  }
  function pilePos() {
    var b = L.bin, dx = (Math.random() - 0.5) * Math.min(720, Math.max(0, b.pw - W)), v = Math.random();
    var p = pileXY(dx, v);
    p.r = (Math.random() - 0.5) * 16; p.dx = dx; p.v = v;
    return p;
  }
  function setPile(el, p) { el._dx = p.dx; el._v = p.v; place(el, p.x, p.y, p.r); }
  // Mémorise la position d'une vignette posée à la main dans le bac, pour la recentrer au redimensionnement.
  function rememberPile(el) {
    var b = L.bin;
    el._dx = el._x - (b.x + (b.pw - W) / 2);
    el._v = (el._y - (b.y + 24)) / Math.max(1, b.h - H - 32);
  }
  function sendToPile(el) {
    var p = pilePos();
    el._f = -1; el._slot = -1;
    el.style.zIndex = ++z;
    animate();
    setPile(el, p);
  }
  function isCorrect(el) { return el._f >= 0 && L.frames[el._f].g === el._g; }
  function inPile(el) { return el._f < 0 && el._y + H / 2 < PAD + PH + 14; }

  function snap(el) {
    var cx = el._x + W / 2, cy = el._y + H / 2, fi = -1;
    L.frames.forEach(function (f, i) {
      if (cx >= f.x && cx <= f.x + f.w && cy >= f.y && cy <= f.y + f.h) fi = i;
    });
    if (fi < 0) { el._f = -1; el._slot = -1; return; }
    var f = L.frames[fi], used = {};
    tiles.forEach(function (t) { if (t !== el && t._f === fi) used[t._slot] = true; });
    var best = -1, bd = Infinity;
    for (var s = 0; s < f.cap; s++) {
      if (used[s]) continue;
      var p = slotPos(f, s), d = (p.x - el._x) * (p.x - el._x) + (p.y - el._y) * (p.y - el._y);
      if (d < bd) { bd = d; best = s; }
    }
    if (best < 0) { sendToPile(el); return; }
    el._f = fi; el._slot = best;
    var q = slotPos(f, best);
    animate();
    place(el, q.x, q.y, 0);
  }

  /* Couleurs : quand 70 % des vignettes d'un GROUPE (hors vignette de départ) sont dans le bon cadre,
     toutes les vignettes de ce groupe se colorent, même mal placées (liseré pointillé). Acquis ensuite.
     Un groupe sans vignette à poser (Verre) se colore avec le premier autre groupe de sa catégorie. */
  function evaluate() {
    var tot = {}, ok = {};
    tiles.forEach(function (t) {
      if (t._lock) return;
      tot[t._g] = (tot[t._g] || 0) + 1;
      if (isCorrect(t)) ok[t._g] = (ok[t._g] || 0) + 1;
    });
    GROUPS.forEach(function (g, gi) {
      if (tot[gi] && !grpLit[gi] && (ok[gi] || 0) >= Math.ceil(THRESH * tot[gi] - 1e-9)) grpLit[gi] = true;
    });
    GROUPS.forEach(function (g, gi) {
      if (tot[gi] || grpLit[gi]) return;
      grpLit[gi] = GROUPS.some(function (h, hi) { return hi !== gi && h.cat === g.cat && grpLit[hi]; });
    });
    L.frames.forEach(function (f) { f.el.classList.toggle("lit", !!grpLit[f.g]); });
    tiles.forEach(function (t) {
      var lit = !!grpLit[t._g];
      t.classList.toggle("lit", lit);
      t.classList.toggle("off", lit && !isCorrect(t));
    });
  }
  function countCorrect() {
    var n = 0;
    tiles.forEach(function (t) { if (isCorrect(t)) n++; });
    return n;
  }

  function setMsg(txt, end) { elMsg.textContent = txt; elMsg.className = "msg" + (end ? " end" : ""); }
  function fmt(s) {
    s = Math.max(0, Math.ceil(s));
    return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }
  function updateButtons() {
    btnStart.disabled = running || ended;
    btnStart.textContent = running ? "En cours" : "Démarrer";
    btnCheck.disabled = !running || checksLeft <= 0;
    btnCheck.textContent = "Vérifier (" + checksLeft + ")";
  }
  function tick() {
    var left = (endAt - Date.now()) / 1000;
    elTimer.textContent = fmt(left);
    elTimer.classList.toggle("low", left <= 60);
    if (left <= 0) finish("time");
  }

  function sendWrong() {
    var sent = 0;
    tiles.forEach(function (t) {
      if (!isCorrect(t) && !inPile(t)) { sendToPile(t); sent++; }
    });
    evaluate();
    return sent;
  }
  function verify() {
    if (!running || checksLeft <= 0) return;
    checksLeft--;
    var ok = countCorrect(), sent = sendWrong();
    var txt = ok + " / " + tiles.length + " bien placées.";
    if (sent) txt += " " + sent + (sent > 1 ? " vignettes renvoyées" : " vignette renvoyée") + " sur le tas.";
    if (checksLeft === 0) txt += " Plus de vérification disponible.";
    setMsg(txt);
    updateButtons();
    if (ok === tiles.length) finish("win");
  }
  function finish(reason) {
    if (ended) return;
    clearInterval(timerId); timerId = null;
    running = false; ended = true;
    board.classList.add("locked");
    var spent = Math.round(DURATION - Math.max(0, (endAt - Date.now()) / 1000));
    var ok = countCorrect();
    sendWrong();
    if (reason === "win") {
      setMsg("Bravo ! " + tiles.length + " / " + tiles.length + " en " + fmt(spent) + ".", true);
    } else {
      setMsg("Temps écoulé. Résultat final : " + ok + " / " + tiles.length + " bien placées.", true);
      elTimer.textContent = "00:00";
    }
    updateButtons();
  }
  function start() {
    if (running || ended) return;
    running = true;
    board.classList.remove("locked");
    endAt = Date.now() + DURATION * 1000;
    timerId = setInterval(tick, 250);
    tick();
    setMsg("C'est parti ! Glisse chaque matière dans un groupe.");
    updateButtons();
  }
  function restart() {
    clearInterval(timerId); timerId = null;
    running = false; ended = false; checksLeft = MAXCHECKS;
    elTimer.textContent = fmt(DURATION);
    elTimer.classList.remove("low");
    board.classList.add("locked");
    grpLit = {};
    tiles.forEach(function (t) { t.classList.remove("lit"); t.classList.remove("off"); });
    build();
    tiles.forEach(function (t) {
      var p = pilePos();
      t._f = -1; t._slot = -1;
      t.style.zIndex = ++z;
      setPile(t, p);
    });
    // Une vignette verrouillée dans chaque groupe, comme point de départ.
    tiles.forEach(function (t) { t._lock = false; t.classList.remove("fixed"); });
    GROUPS.forEach(function (g, gi) {
      var t = byName[SEEDS[g.title]];
      if (!t) return;
      var p = slotPos(L.frames[gi], 0);
      t._lock = true; t._f = gi; t._slot = 0;
      t.classList.add("fixed");
      place(t, p.x, p.y, 0);
    });
    evaluate();
    setMsg("Appuie sur Démarrer : tu as 10 minutes pour ranger les " + (tiles.length - GROUPS.length) + " matières restantes. Une vignette est déjà fixée dans chaque groupe.");
    updateButtons();
  }

  /* Vignettes */
  var names = [];
  GROUPS.forEach(function (g) { g.items.forEach(function (n) { names.push(n); }); });
  names.forEach(function (name) {
    var el = document.createElement("div");
    el.className = "tile";
    el.tabIndex = 0;
    el.textContent = name;
    el._g = groupOf[name];
    el._f = -1; el._slot = -1;
    el.style.setProperty("--c", GROUPS[groupOf[name]].shade);
    board.appendChild(el);
    tiles.push(el);
    byName[name] = el;
    bindDrag(el);
    el.addEventListener("pointerenter", function (e) { if (e.pointerType === "mouse" && !el.classList.contains("drag")) showTip(el); });
    el.addEventListener("pointerleave", function (e) { if (e.pointerType === "mouse") hideTip(); });
    el.addEventListener("focus", function () { if (el.matches(":focus-visible")) showTip(el); });
    el.addEventListener("pointerup", function (e) { if (e.pointerType !== "mouse" && isPhone()) hideTip(); });
    el.addEventListener("pointercancel", function (e) { if (e.pointerType !== "mouse" && isPhone()) hideTip(); });
    el.addEventListener("blur", hideTip);
  });

  function clamp(x, y) {
    return [Math.min(Math.max(0, x), Math.max(0, board.clientWidth - W)),
            Math.min(Math.max(0, y), Math.max(0, board.clientHeight - H))];
  }
  function bindDrag(el) {
    var sx, sy, ox, oy, id = null, moved = false, bl0 = 0, bt0 = 0, lx = 0, ly = 0;
    function reposition() {
      var r = board.getBoundingClientRect();
      var c = clamp(ox + lx - sx + (bl0 - r.left), oy + ly - sy + (bt0 - r.top));
      place(el, c[0], c[1], 0);
    }
    el.addEventListener("pointerdown", function (e) {
      hideTip();
      if (e.pointerType !== "mouse" && isPhone()) showTip(el);
      if (!running || el._lock) return;
      if (e.button !== undefined && e.button !== 0) return;
      id = e.pointerId; moved = false;
      el.setPointerCapture(id);
      sx = e.clientX; sy = e.clientY; ox = el._x; oy = el._y; lx = sx; ly = sy;
      var br = board.getBoundingClientRect(); bl0 = br.left; bt0 = br.top;
      el._f = -1; el._slot = -1;
      el.classList.add("drag");
      el.style.zIndex = ++z;
      place(el, el._x, el._y, 0);
      evaluate();
      e.preventDefault();
    });
    el.addEventListener("pointermove", function (e) {
      if (id !== e.pointerId) return;
      moved = true;
      lx = e.clientX; ly = e.clientY;
      reposition();
      autoScroll(ly, reposition);
    });
    function end(e) {
      if (id !== e.pointerId) return;
      id = null;
      autoStop();
      el.classList.remove("drag");
      snap(el);
      if (el._f < 0) rememberPile(el);
      evaluate();
      if (e.pointerType !== "mouse" && isPhone()) {
        hideTip();
      } else if (e.pointerType !== "mouse" && !moved) {
        showTip(el);
        tipTimer = setTimeout(hideTip, 2500);
      } else if (e.pointerType === "mouse") {
        showTip(el);
      }
    }
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", end);
    el.addEventListener("keydown", function (e) {
      if (!running || el._lock) return;
      var d = e.shiftKey ? 40 : 12, dx = 0, dy = 0;
      if (e.key === "ArrowLeft") dx = -d;
      else if (e.key === "ArrowRight") dx = d;
      else if (e.key === "ArrowUp") dy = -d;
      else if (e.key === "ArrowDown") dy = d;
      else return;
      e.preventDefault();
      el._f = -1; el._slot = -1;
      var c = clamp(el._x + dx, el._y + dy);
      place(el, c[0], c[1], 0);
      el.style.zIndex = ++z;
    });
    el.addEventListener("keyup", function (e) {
      if (!running || el._lock || e.key.indexOf("Arrow") !== 0) return;
      snap(el);
      if (el._f < 0) rememberPile(el);
      evaluate();
    });
  }

  btnStart.addEventListener("click", start);
  btnCheck.addEventListener("click", verify);
  btnRestart.addEventListener("click", restart);

  var lastW = 0;
  var onResize = function () {
    var w = board.clientWidth;
    if (w === lastW) return;
    lastW = w;
    build();
    var byF = {};
    tiles.forEach(function (t) { if (t._f >= 0) (byF[t._f] = byF[t._f] || []).push(t); });
    Object.keys(byF).forEach(function (fi) {
      var f = L.frames[fi];
      byF[fi].sort(function (a, b) { return a._slot - b._slot; }).forEach(function (t, i) {
        if (i >= f.cap) { sendToPile(t); return; }
        t._slot = i;
        var p = slotPos(f, i);
        place(t, p.x, p.y, 0);
      });
    });
    tiles.forEach(function (t) {
      if (t._f < 0) { var p = pileXY(t._dx || 0, t._v === undefined ? 0.5 : t._v); place(t, p.x, p.y, t._r); }
    });
    evaluate();
  };

  // Mélange de l'ordre d'empilement, puis premier tas.
  for (var i = tiles.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = tiles[i]; tiles[i] = tiles[j]; tiles[j] = tmp;
  }
  restart();
  lastW = board.clientWidth;
  // Réagit aussi à l'apparition d'une barre de défilement (la largeur du tableau change sans événement resize).
  if (window.ResizeObserver) new ResizeObserver(onResize).observe(board);
  else window.addEventListener("resize", onResize);
})();
</script>
</body>
</html>
